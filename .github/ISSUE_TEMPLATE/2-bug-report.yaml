name: Bug Report
description: Report a problem or unexpected behavior
labels:
  - possible-bug
body:
  - type: dropdown
    id: deployment-type
    validations:
      required: true
    attributes:
      label: Deployment Type
      description: How are you running Ultraglass?
      multiple: false
      options:
        - Docker
        - Manual
        - Other (please explain)
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Ultraglass are you currently running?
      placeholder: v3.2.1
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    validations:
      required: true
    attributes:
      label: Steps to Reproduce
      description: >
        Describe in detail the exact steps one can take to reproduce this bug.
        If reporting a UI bug, be sure to include screenshots, browser version, and operating system and platform.
        If you've deployed Ultraglass manually, be sure to include Python and NodeJS versions.
      placeholder: |
        1. Click the thing
        2. Type the stuff
        3. See the error
  - type: textarea
    id: expected-behavior
    validations:
      required: true
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: A thing should have happened.
  - type: textarea
    id: observed-behavior
    validations:
      required: true
    attributes:
      label: Observed Behavior
      description: What actually happened?
      placeholder: An error was shown.
  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Ultraglass [config](https://github.com/WilhelmZA/ultraglass/tree/main/docs/content/configuration/config) file in YAML format.
      placeholder: |
        org_name: Beloved Ultraglass User
        plugins: []
        primary_asn: 65000
        request_timeout: 90
        site_description: Beloved Ultraglass User Network Looking Glass
        site_title: Ultraglass
      render: yaml
  - type: textarea
    id: devices
    attributes:
      label: Devices
      description: >
        Ultraglass [devices](https://github.com/WilhelmZA/ultraglass/blob/main/docs/content/configuration/devices.mdx) file in YAML format
        **with passwords obfuscated or removed**.
      placeholder: |
        devices:
        - name: New York, NY
          address: 192.0.2.1
          platform: cisco_ios
          credential:
              username: ***
              password: ***
        - name: San Francisco, CA
          address: 192.0.2.2
          platform: juniper
          credential:
              username: ***
              password: ***
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run `hyperglass support-bundle` on the Ultraglass host and attach the resulting JSON file. The bundle is sanitized locally and is not uploaded automatically. You may also include relevant log messages, but remove credentials, tokens, private addresses, and device output first.
      render: console
