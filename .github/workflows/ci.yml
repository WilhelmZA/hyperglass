name: CI and Docker Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to Docker Hub
        required: true
        default: false
        type: boolean
      version:
        description: Image version when publishing manually, without the leading v
        required: false
        type: string

permissions:
  contents: read

env:
  DOCKERHUB_REPOSITORY: wilhelmza/ultraglass

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HYPERGLASS_APP_PATH: ${{ github.workspace }}/.hyperglass
      HYPERGLASS_HOST: 127.0.0.1
      HYPERGLASS_PORT: 8001
      HYPERGLASS_REDIS_HOST: 127.0.0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv pip install --system -r requirements-dev.lock

      - name: Prepare application directory
        run: mkdir -p "$HYPERGLASS_APP_PATH"

      - name: Test Python
        run: pytest hyperglass --ignore hyperglass/plugins/external

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hyperglass/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create empty hyperglass.json
        run: printf '{}\n' > hyperglass.json

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint TypeScript
        run: pnpm run lint

      - name: Check TypeScript types
        run: pnpm run typecheck

      - name: Test TypeScript
        run: pnpm run test

  docker:
    name: Build and publish Docker image
    needs:
      - backend
      - frontend
    if: ${{ always() && needs.backend.result == 'success' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate manual release version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: test -n "${{ inputs.version }}"

      - name: Log in to Docker Hub
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_REPOSITORY }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.version != '' }}
            type=raw,value=latest

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
